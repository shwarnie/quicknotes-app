<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>QuickNotes</h1>
        <p>Capture your thoughts. Keep your ideas organised.</p>
    </header>

    <main>
        <section id="add-note-section">
            <h2>Add a note</h2>

            <form id="note-form">
                <label for="note-input">Your note</label>

                <input
                    type="text"
                    id="note-input"
                    name="note"
                    placeholder="Write your note..."
                >

                <select id="note-category" name="category">
                    <option value="Personal">Personal</option>
                    <option value="Work">Work</option>
                    <option value="Study">Study</option>
                </select>

              
                <button type="submit">Add Note</button>

            </form>
<p>
           
            <p>
            <p id="error-message"></p>
        </section>

        <section id="notes-section">
            <h2>Your notes</h2>

            <input
                type="search"
                id="search-input"
                placeholder="Search your notes..."
            >

            

            <p id="note-count">You have no notes yet.</p>

            <ul id="notes-list"></ul>
        </section>
         <button type="button" id="clear-all">Clear All</button>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes. Keep your thoughts organised.</p>
    </footer>

</body>
</html>
